  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f5fb;
    color: #14142b;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 40px 20px 32px; text-align: center; }
  .logo {
    width: 148px; height: 148px; object-fit: cover;
    border-radius: 34px; display: block; margin: 0 auto;
    box-shadow: 0 12px 32px rgba(10, 10, 30, .28);
  }
  h1 { font-size: 32px; margin: 20px 0 6px; letter-spacing: -.5px; }
  .tagline { color: #5b5a72; font-size: 15px; line-height: 1.6; margin: 0 0 28px; }
  .links { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 16px 20px; border-radius: 16px; text-decoration: none;
    font-weight: 700; font-size: 16px; color: #fff;
    box-shadow: 0 6px 18px rgba(10, 10, 30, .14);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn.wa { background: #22b45e; }
  .btn.ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
  .btn.tg { background: #229ED9; }
  .btn.store { background: #14142b; }
  .btn.rgb {
    position: relative; overflow: hidden;
    background-size: 300% 300%;
    animation: rgbShift 6s ease infinite;
  }
  .btn.rgb.api { background-image: linear-gradient(90deg, #7c3aed, #2563eb, #06b6d4, #7c3aed); }
  .btn.rgb.tfa { background-image: linear-gradient(90deg, #f59e0b, #ec4899, #8b5cf6, #f59e0b); }
  .btn.rgb::after {
    content: ""; position: absolute; top: 0; left: -80%;
    width: 60%; height: 100%; pointer-events: none;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
    transform: skewX(-20deg);
    animation: shine 3.2s ease-in-out infinite;
  }
  @keyframes rgbShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes shine {
    0% { left: -80%; }
    55% { left: 130%; }
    100% { left: 130%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn.rgb, .btn.rgb::after { animation: none; }
  }
  .btn svg { flex: none; }
  footer { margin-top: 24px; color: #8a89a3; font-size: 13px; }
